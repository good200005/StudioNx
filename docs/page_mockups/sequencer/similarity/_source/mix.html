<div class="app" id="app"></div>
<script>
const FL = Math.max(0, Math.min(100, +(new URLSearchParams(location.search).get('fl') ?? 0)));
const A = 100 - FL, on = t => FL >= t;
const mix = (a, b) => { const p = FL / 100, h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const x = h(a), y = h(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * p).toString(16).padStart(2, '0')).join(''); };
const R = document.documentElement.style, set = (k, v) => R.setProperty(k, v);
// 색조: Ableton 무채색 회색 ↔ FL 자줏빛
set('--bg', mix('#1b1b1e', '#2b1f2b')); set('--panel', mix('#242427', '#3a2a37')); set('--panel2', mix('#2c2c30', '#442f40'));
set('--grid', mix('#1f1f22', '#33232f')); set('--gridline', mix('#2b2b2f', '#422e3c')); set('--line', mix('#36363b', '#523a4c'));
set('--line2', mix('#4a4a50', '#6b4f63')); set('--sel', mix('#3a3a40', '#5b3d55'));
set('--r', (FL / 100 * 3).toFixed(1) + 'px'); set('--cr', on(30) ? '3px' : '1px'); set('--wr', '6px');
// 항목 10가지 (매뉴얼 용어)
const STEPS = [
  [10, 'Status Bar·Info View → Hint Bar'], [20, 'Browser(sidebar+content pane) → 폴더 트리'], [30, 'Overview·Scrub Area·Locators·파스텔 클립 → Time Markers·클립 종류 색/아이콘'],
  [40, 'Control Bar 9구역 → 툴바 패널(Song Position·Pattern Selector·Snap·창 바로가기)'], [50, '오른쪽 Track Headers·Time Ruler → 왼쪽 Playlist Track Header + 도구 P·B·D·T·S·C·E'],
  [60, 'Picker Panel'], [70, '트랙 안 오토메이션 → Automation clips'], [80, '트랙 머리 믹서·Return 트랙 → Mixer 창(Insert·라우팅·슬롯 10·EQ)'],
  [90, 'Detail View(Clip View+Device View) → 떠 있는 Piano roll'], [100, 'Channel Rack(스텝 시퀀서)'],
];
set('--top-h', on(40) ? '62px' : '40px');
set('--overview-h', on(30) ? '0px' : '18px');
set('--browser-w', on(20) ? '240px' : '290px');
