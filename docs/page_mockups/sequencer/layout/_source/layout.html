<!doctype html>
<!-- 시퀀서 기본 배치 목업 — layout.html?s=1..8
     기준: studionx/frontend-reference/images/sequencer reference/sequencer 기본 배치.pdf (사용자, 2026-10-05)
       - 헤더: 유사도 목업 Ableton 60 : FL 40 의 헤더
       - 왼쪽: 버튼 줄(파일 분류·협업) + 파일 패널(검색은 맨 아래, 업로드 버튼·끌어 넣기) + 협업 패널(평소 숨김)
       - 트랙: Ableton 50 : FL 50 의 트랙 디자인, 오토메이션 선 없앰. 트랙 머리에 on/off(FL) + V(펼침) 버튼, 한 트랙 = 악기 하나(Ableton)
       - 오토메이션 모드(A): 패턴을 흐리게, 그 위에 오토메이션(FL식 클립). 놓인 패턴 영역에 따라 적용 대상이 정해짐
       - 트랙 펼침: [악기] [이펙트 — FL Patcher식 분기, 오른쪽 + 직렬 / 아래 + 병렬, 병합 버튼] [가: 연결] [나: 믹서]
       - 아래 칸: 평소엔 트랙, MIDI 패턴 클릭 = 피아노 롤, 샘플 클릭 = 샘플 설정, Nyxi 더블클릭 = Agent 조언·채팅
       - Nyxi: 재생 중 BPM 에 맞춰 춤 (fruity dance 처럼) -->
<html lang="ko"><head><meta charset="utf-8"><title>Sequencer layout mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&display=block">
<style>
  :root { --v:#6a24f6; --vi:#a383ff; --ink:#ece9f2; --soft:#a9a5b4; --faint:#6f6b7a; --org:#ffad33; --red:#ff5d5d; --grn:#7ee08a;
    --bg:#231d25; --panel:#2f2732; --panel2:#382d38; --grid:#29212a; --gridline:#372b36; --line:#443844; --line2:#5b4c5a; --sel:#4b3c4b; --r:1.5px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 960px; overflow: hidden; }
  body { font: 11.5px/1.3 "Segoe UI", "Malgun Gothic", sans-serif; color: var(--ink); background: var(--bg); position: relative; }
  .app { position: absolute; inset: 0 0 60px 0; display: grid; grid-template-rows: 62px 1fr; grid-template-columns: 52px var(--side-w) 1fr; }
  .chip { border: 1px solid var(--line); padding: 2px 6px; color: var(--soft); background: var(--panel2); border-radius: var(--r); white-space: nowrap; }
  .chip.on { color: #fff; background: var(--v); border-color: var(--v); }
  .sp { flex: 1; }
  .langmenu { position: absolute; z-index: 30; top: 30px; right: 70px; width: 150px; background: var(--panel); border: 1px solid var(--vi); border-radius: 5px; box-shadow: 0 10px 30px rgb(0 0 0 / .6); padding: 4px; }
  .langmenu div { padding: 5px 8px; border-radius: 3px; display: flex; justify-content: space-between; color: var(--soft); } .langmenu div.on { background: var(--sel); color: #fff; } .langmenu div.on::after { content: "✓"; color: var(--vi); }
  .langmenu small { display: block; color: var(--faint); font-size: 10px; padding: 4px 8px 2px; border-top: 1px solid var(--line); margin-top: 3px; }
  /* 헤더 (Ableton 60 : FL 40) */
  .top { grid-column: 1 / -1; background: var(--panel); border-bottom: 1px solid var(--line); display: grid; grid-template-rows: 1fr 1fr; }
  .top > div { display: flex; align-items: center; gap: 6px; padding: 0 8px; white-space: nowrap; }
  .top > div + div { border-top: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 6px; font: 800 12px/1 Unbounded, sans-serif; color: #fff; padding-right: 6px; }
  .brand svg { width: 15px; height: 15px; color: var(--vi); }
  .menu span { color: var(--soft); font-size: 11px; letter-spacing: .04em; margin-right: 4px; }
  .tp { display: flex; gap: 3px; } .tp i { width: 24px; height: 20px; display: grid; place-items: center; font-style: normal; border: 1px solid var(--line); background: var(--panel2); border-radius: var(--r); color: var(--soft); }
  .tp i.play { color: var(--grn); border-color: var(--grn); } .tp i.rec { color: var(--red); }
  .lcd { font: 300 24px/1 "Segoe UI Light", "Segoe UI", sans-serif; padding: 1px 8px; background: rgb(0 0 0 / .28); border-radius: var(--r); color: #f1e9ff; }
  .lcd small { font-size: 9px; color: var(--faint); margin-left: 3px; }
  .scope { width: 70px; height: 22px; background: rgb(0 0 0 / .3); border-radius: var(--r); position: relative; overflow: hidden; }
  .scope svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hintbar { flex: 1; color: var(--soft); font-size: 11px; background: rgb(0 0 0 / .18); padding: 3px 8px; border-radius: var(--r); overflow: hidden; }
  .hintbar b { color: #fff; font-weight: 600; }
  .sc { display: flex; gap: 3px; } .sc i { display: grid; place-items: center; width: 24px; height: 22px; font-style: normal; border: 1px solid var(--line); background: var(--panel2); border-radius: var(--r); color: var(--soft); font-size: 11px; }
  .sc i.on { color: #fff; border-color: var(--vi); }
  /* 버튼 줄 */
  .rail { grid-row: 2; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 3px; }
  .rail .b { width: 42px; height: 42px; display: grid; place-items: center; align-content: center; gap: 1px; border-radius: 4px; color: var(--soft); font-size: 15px; position: relative; }
  .rail .b small { font-size: 8.5px; letter-spacing: -.02em; white-space: nowrap; }
  .rail .b.on { background: var(--sel); color: #fff; box-shadow: inset 2px 0 0 var(--vi); }
  .rail .b.ai::after { content: ""; position: absolute; top: 5px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--org); }
  .rail .b .cnt { position: absolute; top: 3px; right: 3px; font-size: 8px; background: var(--red); color: #fff; border-radius: 6px; padding: 0 3px; font-style: normal; }
  .rail hr { width: 30px; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  /* 왼쪽 패널 */
  .side { grid-row: 2; background: var(--panel); border-right: 1px solid var(--line); display: grid; grid-template-rows: 1fr var(--collab-h); min-height: 0; overflow: hidden; }
  .files { display: flex; flex-direction: column; min-height: 0; }
  .ph { display: flex; align-items: center; gap: 6px; padding: 8px 10px 6px; }
  .ph h3 { font-size: 13px; font-weight: 600; } .ph .up { margin-left: auto; color: #fff; background: var(--v); border: 0; padding: 3px 8px; border-radius: 3px; font-size: 11px; }
  .filt { display: flex; flex-wrap: wrap; gap: 3px; padding: 0 10px 6px; } .filt span { font-size: 10px; border: 1px solid var(--line); padding: 1px 6px; border-radius: 9px; color: var(--soft); } .filt span.on { color: #fff; border-color: var(--vi); }
  .list { flex: 1; overflow: hidden; border-top: 1px solid var(--line); }
  .it { display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 6px; padding: 5px 10px; border-bottom: 1px solid rgb(255 255 255 / .03); align-items: center; }
  .it.on { background: var(--sel); }
  .it em { font-style: normal; color: var(--faint); font-size: 10px; }
  .it .w { grid-column: 2 / -1; height: 12px; background: linear-gradient(transparent 20%, #9fe0b4 20% 80%, transparent 80%); mask: repeating-linear-gradient(90deg, #000 0 1px, transparent 1px 2px); opacity: .5; }
  .drop { margin: 6px 10px; border: 1px dashed var(--line2); border-radius: 4px; padding: 8px; text-align: center; color: var(--faint); font-size: 10.5px; }
  .search { margin: 0; padding: 7px 10px; border-top: 1px solid var(--line); color: var(--faint); background: var(--panel2); }
  .collab { border-top: 2px solid var(--vi); display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--panel2); }
  .mem { display: flex; align-items: center; gap: 7px; padding: 4px 10px; }
  .av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #111; position: relative; }
  .av::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 7px; height: 7px; border-radius: 50%; background: var(--grn); border: 1px solid var(--panel2); }
  .av.off::after { background: var(--faint); }
  .mem em { margin-left: auto; font-style: normal; font-size: 10px; color: var(--faint); }
  .chat { flex: 1; border-top: 1px solid var(--line); padding: 6px 10px; display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
  .msg { font-size: 11px; } .msg b { font-weight: 600; margin-right: 4px; } .msg time { color: var(--faint); font-size: 9.5px; margin-left: 4px; }
  .chatin { margin-top: auto; border: 1px solid var(--line); padding: 5px 8px; color: var(--faint); border-radius: 3px; background: var(--panel); }
  /* 메인 */
  .main { grid-row: 2; display: grid; grid-template-rows: 26px 20px 18px 1fr var(--ctx-h); min-width: 0; min-height: 0; position: relative; background: var(--grid); }
  .pltool { display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--panel2); border-bottom: 1px solid var(--line); color: var(--soft); white-space: nowrap; }
  .pltool i { font-style: normal; height: 18px; padding: 0 5px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: var(--r); font-size: 10px; }
  .pltool i.on { color: #fff; border-color: var(--vi); background: rgb(106 36 246 / .3); }
  .pltool i.auto { color: #111; background: #c8e08a; border-color: #c8e08a; font-weight: 700; }
  .pltool .crumb { margin-left: 8px; }
  .rowx { display: grid; grid-template-columns: 200px 1fr; }
  .ruler { display: flex; border-bottom: 1px solid var(--line); background: var(--panel2); color: var(--faint); font-size: 10px; }
  .ruler span { flex: 1; border-left: 1px solid var(--line); padding: 3px; }
  .corner { background: var(--panel2); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  .marks { position: relative; border-bottom: 1px solid var(--line); background: var(--panel); }
  .marks span { position: absolute; top: 2px; font-size: 10px; color: #f0d9a8; white-space: nowrap; } .marks span::before { content: "▾ "; color: var(--org); }
  .tracks { overflow: hidden; position: relative; }
  .tr { display: grid; grid-template-columns: 200px 1fr; height: 44px; border-bottom: 1px solid var(--line); }
  .th { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 0; background: var(--panel2); border-right: 1px solid var(--line); position: relative; }
  .th::before { content: ""; width: 4px; align-self: stretch; background: var(--tc); }
  .pw { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; } .pw::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--grn); box-shadow: 0 0 5px var(--grn); }
  .pw.off::after { background: #4a3e48; box-shadow: none; }
  .vb { width: 18px; height: 18px; border: 1px solid var(--line2); border-radius: 3px; display: grid; place-items: center; font-size: 10px; color: var(--soft); font-weight: 700; }
  .vb.on { background: var(--v); border-color: var(--v); color: #fff; }
  .tbtn { margin-left: auto; display: flex; gap: 2px; }
  .tbtn i { width: 17px; height: 17px; display: grid; place-items: center; font-style: normal; font-size: 9.5px; font-weight: 700; border: 1px solid var(--line2); border-radius: 2px; color: var(--soft); background: rgb(0 0 0 / .15); }
  .tbtn i.m.on { background: #f2c94c; border-color: #f2c94c; color: #111; } .tbtn i.s.on { background: #3ab8c9; border-color: #3ab8c9; color: #111; } .tbtn i.r { color: #c97a7a; } .tbtn i.r.on { background: var(--red); border-color: var(--red); color: #fff; }
  .addrow { display: grid; grid-template-columns: 200px 1fr; height: 45px; border-bottom: 1px solid var(--line); }
  .addrow .add { margin: 0; border: 1px dashed var(--line2); border-left: 4px solid var(--line2); border-radius: 0; display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--soft); font-size: 11.5px; background: rgb(255 255 255 / .02); }
  .addrow .add b { color: #fff; font-weight: 600; } .addrow .add span { margin-left: auto; display: flex; gap: 3px; } .addrow .add span i { font-style: normal; font-size: 9.5px; border: 1px solid var(--line2); border-radius: 2px; padding: 0 4px; color: var(--faint); }
  .tn .lk { font-style: normal; font-weight: 700; font-size: 9px; color: #111; background: var(--vi); border-radius: 2px; padding: 0 3px; }
  .istack { padding: 6px; display: grid; gap: 4px; align-content: start; }
  .irow { display: grid; grid-template-columns: 14px 1fr 70px 20px 18px; gap: 6px; align-items: center; border: 1px solid var(--line2); border-radius: 4px; padding: 4px 6px; background: var(--panel2); }
  .irow .pw2 { color: var(--grn); font-size: 11px; } .irow .nm { display: grid; line-height: 1.15; overflow: hidden; } .irow .nm b { font-size: 11px; white-space: nowrap; } .irow .nm small { font-size: 9.5px; color: var(--faint); white-space: nowrap; }
  .irow .hv { display: grid; gap: 1px; font-size: 9px; color: var(--soft); } .irow .hv s { height: 5px; background: rgb(0 0 0 / .4); border-radius: 3px; position: relative; text-decoration: none; } .irow .hv s::after { content: ''; position: absolute; inset: 0 auto 0 0; width: var(--v); background: #3ab8c9; border-radius: 3px; }
  .irow .pk { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--soft); position: relative; } .irow .pk::after { content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 7px; background: var(--soft); transform: translateX(-50%) rotate(var(--p)); transform-origin: 50% 7px; }
  .irow .so { width: 17px; height: 17px; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; border: 1px solid var(--line2); border-radius: 2px; color: var(--soft); } .irow .so.on { background: #3ab8c9; border-color: #3ab8c9; color: #111; }
  .irow.from { border-style: dashed; border-color: var(--vi); background: rgb(106 36 246 / .14); } .irow.from .nm b { color: #d6c8ff; }
  .iadd { border: 1px dashed var(--line2); border-radius: 4px; text-align: center; color: var(--soft); padding: 4px; font-size: 11px; }
  .sendto { align-self: center; border: 1px dashed var(--vi); border-radius: 4px; padding: 8px 10px; color: #d6c8ff; background: rgb(106 36 246 / .12); font-size: 11px; line-height: 1.45; }
  .tn { display: grid; line-height: 1.2; overflow: hidden; } .tn b { font-weight: 600; font-size: 11.5px; white-space: nowrap; } .tn small { color: var(--faint); font-size: 9.5px; white-space: nowrap; }
  .tl { position: relative; background-image: repeating-linear-gradient(90deg, transparent 0 27.875px, var(--gridline) 27.875px 28.875px); }
  .clip { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; overflow: hidden; display: flex; flex-direction: column; background: var(--cc); }
  .clip b { font-weight: 600; font-size: 10.5px; padding: 1px 5px; white-space: nowrap; overflow: hidden; color: #fff; }
  .mn { position: relative; flex: 1; margin: 2px 3px 3px; }
  .mn i { position: absolute; height: 3px; min-width: 2px; border-radius: 1px; background: #c9f2d5; box-shadow: 0 0 0 .5px rgb(0 0 0 / .25); }
  .clip u { flex: 1; text-decoration: none; background-image: repeating-linear-gradient(90deg, transparent 0 7px, #9fe0b4 7px 9px); background-size: 100% 40%; background-repeat: repeat-x; background-position: 0 60%; }
  .clip.audio u { background: linear-gradient(transparent 20%, #9fe0b4 20% 80%, transparent 80%); mask: repeating-linear-gradient(90deg, #000 0 2px, transparent 2px 3px); opacity: .7; }
  .clip .wv { flex: 1; width: 100%; min-height: 0; background: rgb(0 0 0 / .2); }
  .clip.sel { outline: 2px solid #fff; outline-offset: -1px; }
  .automode .clip { opacity: .25; }
  .aenv { position: absolute; top: 2px; bottom: 2px; border: 1px solid #c8e08a; border-radius: 3px; background: rgb(200 224 138 / .12); z-index: 2; }
  .aenv b { position: absolute; top: 0; left: 0; font-size: 10px; background: #c8e08a; color: #10120a; padding: 0 5px; white-space: nowrap; }
  .aenv svg { position: absolute; inset: 12px 0 2px; width: 100%; height: calc(100% - 14px); overflow: visible; }
  .aenv.cut { border-right: 2px solid #ff8a5c; }
  .limit { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 2px dashed var(--red); z-index: 3; }
  .limit span { position: absolute; left: 4px; bottom: -1px; font-size: 9.5px; color: #ffb3b3; white-space: nowrap; background: rgb(11 10 15 / .85); padding: 0 4px; border-radius: 2px; }
  .clip.new { opacity: 1 !important; outline: 2px dashed #fff; outline-offset: -1px; z-index: 4; }
  .veil { position: absolute; inset: 0; background: rgb(8 6 10 / .35); z-index: 20; }
  .dlg { position: absolute; z-index: 21; left: 50%; top: 338px; translate: -50% 0; width: 520px; background: var(--panel); border: 1px solid var(--vi); border-radius: 8px; box-shadow: 0 20px 60px rgb(0 0 0 / .7); overflow: hidden; }
  .dlg header { padding: 10px 14px; background: var(--panel2); border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .dlg header::after { content: "✕"; margin-left: auto; color: var(--faint); font-weight: 400; }
  .dlg .bd { padding: 12px 14px; display: grid; gap: 10px; }
  .dlg .bd p { color: var(--soft); line-height: 1.5; } .dlg .bd p b { color: #fff; }
  .mini { position: relative; height: 54px; background: var(--grid); border: 1px solid var(--line); border-radius: 4px; background-image: repeating-linear-gradient(90deg, transparent 0 29px, var(--gridline) 29px 30px); }
  .mini .c { position: absolute; top: 6px; height: 20px; border-radius: 3px; font-size: 10px; color: #fff; padding: 2px 5px; white-space: nowrap; }
  .mini .a { position: absolute; top: 30px; height: 18px; border: 1px solid #c8e08a; background: rgb(200 224 138 / .15); border-radius: 3px; font-size: 9.5px; color: #c8e08a; padding: 1px 4px; white-space: nowrap; overflow: hidden; }
  .mini .x { position: absolute; top: 2px; bottom: 2px; border-left: 2px solid #ff8a5c; }
  .opt { display: grid; grid-template-columns: 16px 1fr; gap: 2px 8px; padding: 8px 10px; border: 1px solid var(--line2); border-radius: 5px; align-items: start; }
  .opt.on { border-color: var(--vi); background: rgb(106 36 246 / .14); }
  .opt i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--soft); margin-top: 1px; } .opt.on i { border-color: var(--vi); box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 7px var(--vi); }
  .opt b { font-weight: 600; } .opt small { grid-column: 2; color: var(--faint); font-size: 10.5px; } .opt em { font-style: normal; font-size: 9.5px; color: #111; background: #c8e08a; border-radius: 2px; padding: 0 4px; margin-left: 6px; }
  .dlg footer { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); color: var(--soft); }
  .dlg footer .ck { width: 12px; height: 12px; border: 1px solid var(--soft); border-radius: 2px; }
  .dlg footer .bt { padding: 4px 12px; border-radius: 4px; border: 1px solid var(--line2); color: var(--ink); } .dlg footer .bt.go { background: var(--v); border-color: var(--v); color: #fff; }
  .aenv.ghost { border-style: dashed; background: rgb(200 224 138 / .06); }
  .tip { position: absolute; z-index: 8; background: #0b0a0f; border: 1px solid var(--vi); color: var(--ink); padding: 6px 9px; border-radius: 5px; font-size: 11px; line-height: 1.45; box-shadow: 0 6px 20px rgb(0 0 0 / .5); }
  .tip b { color: var(--vi); }
  .playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: #fff; opacity: .75; z-index: 3; }
  /* 트랙 펼침 */
  .acc { position: relative; z-index: 4; border-bottom: 1px solid var(--line2); background: #1d171f; display: grid; grid-template-columns: 196px 1fr 170px 112px; gap: 8px; padding: 8px 8px 8px 12px; height: var(--acc-h); box-shadow: inset 0 3px 8px rgb(0 0 0 / .4); border-left: 3px solid var(--v); }
  .cell { border: 1px solid var(--line); border-radius: 5px; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .cell > h4 { font-size: 10px; letter-spacing: .08em; color: var(--faint); font-weight: 600; padding: 5px 8px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
  .cell > h4 .k { color: #fff; background: var(--v); border-radius: 3px; padding: 0 5px; letter-spacing: 0; }
  .inst { padding: 8px; display: grid; gap: 6px; }
  .inst .name { font-weight: 600; font-size: 13px; } .inst .name::before { content: "● "; color: var(--org); }
  .knobs { display: flex; gap: 8px; flex-wrap: wrap; } .knob { display: grid; justify-items: center; gap: 2px; font-size: 9px; color: var(--faint); }
  .knob i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #3ab8c9; border-right-color: transparent; transform: rotate(var(--a, 30deg)); }
