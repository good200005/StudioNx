[project]
name = "studionx-backend"
version = "0.1.0"
description = "Studio Nx — 웹 기반 DAW 시퀀서 백엔드 (FastAPI)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
