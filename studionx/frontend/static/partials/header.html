<!-- 공통 헤더 (모든 페이지) — core/include.js 가 <div data-include="static/partials/header.html"> 자리에 끼움
     - 링크는 home.html 기준 (다른 페이지에서도 동작). home.html 안에서는 같은 문서라 새로고침 없이 스크롤
     - 페이지별 차이는 그 페이지 CSS로 (예: join.css 는 섹션 메뉴·Join Us 숨김)
     - 로그인 상태(<html data-auth="in">)면 My Page·My Projects — auth.css -->
<header class="site-header">
  <a class="brand" href="home.html#top" aria-label="Studio Nx home">
    <!-- 로고 마크 S2 (Nyxi 초승달 머리핀 + 반짝임, 겹친 곳은 비움 — evenodd). 원본: static/assets/logo/mark.svg -->
    <svg class="brand__mark" viewBox="-1 -5 98 98" aria-hidden="true">
      <path fill="currentColor" fill-rule="evenodd" d="M73.76 16.83A42 42 0 1 0 88.14 62.36A28 28 0 1 1 73.76 16.83ZM64 -2Q66.66 14.34 83 17Q66.66 19.66 64 36Q61.34 19.66 45 17Q61.34 14.34 64 -2Z"/>
    </svg>
    <span class="brand__name">Studio Nx</span>
  </a>

  <nav class="site-nav" aria-label="Sections">
    <ul class="site-nav__list">
      <li><a class="site-nav__link" href="home.html#service">Service</a></li>
      <li><a class="site-nav__link" href="home.html#character">Character</a></li>
      <li><a class="site-nav__link" href="home.html#feature">Feature</a></li>
      <li><a class="site-nav__link" href="home.html#development">Development</a></li>
      <li><a class="site-nav__link" href="home.html#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- 로그인 상태(<html data-auth="in">)면 My Page·My Projects가 보임 — auth.css, 상태 확인은 home.js(P1-07) -->
  <div class="site-actions">
    <button type="button" class="btn btn--ghost" command="show-modal" commandfor="login-modal" data-auth-show="out">Sign In</button>
    <a class="btn btn--primary site-actions__join" href="join.html" data-auth-show="out">Join Us</a>
    <a class="btn btn--ghost" href="myPage.html" data-auth-show="in">My Page</a>
    <a class="btn btn--primary" href="myProject.html" data-auth-show="in">My Projects</a>
  </div>

  <details class="menu">
    <summary>Menu</summary>
    <div class="menu__panel">
      <nav aria-label="Sections (mobile)">
        <ul class="site-nav__list">
          <li><a class="site-nav__link" href="home.html#service">Service</a></li>
          <li><a class="site-nav__link" href="home.html#character">Character</a></li>
          <li><a class="site-nav__link" href="home.html#feature">Feature</a></li>
          <li><a class="site-nav__link" href="home.html#development">Development</a></li>
          <li><a class="site-nav__link" href="home.html#contact">Contact</a></li>
        </ul>
      </nav>
      <div class="site-actions">
        <button type="button" class="btn btn--ghost" command="show-modal" commandfor="login-modal" data-auth-show="out">Sign In</button>
        <a class="btn btn--primary site-actions__join" href="join.html" data-auth-show="out">Join Us</a>
        <a class="btn btn--ghost" href="myPage.html" data-auth-show="in">My Page</a>
        <a class="btn btn--primary" href="myProject.html" data-auth-show="in">My Projects</a>
      </div>
    </div>
  </details>
</header>
