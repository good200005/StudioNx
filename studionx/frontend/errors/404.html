<!doctype html>
<!-- 오류 404 Not Found 페이지 (P1-22, docs/ai-notes/11_error_pages.md)
     백엔드가 없는 주소(페이지 요청)일 때 이 파일을 상태 404로 돌려줌 (core/errors.py TODO)
     <base href="/"> : /a/b/c 처럼 깊은 주소에서 열려도 CSS·헤더·링크가 사이트 루트 기준으로 동작 -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>Lost the signal (404) — Studio Nx</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0a0f">
  <link rel="icon" type="image/svg+xml" href="static/assets/logo/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

  <link rel="stylesheet" href="static/css/tokens.css">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/cursor.css">
  <link rel="stylesheet" href="static/css/forms.css">
  <link rel="stylesheet" href="static/css/auth.css">
  <link rel="stylesheet" href="static/css/pages/error.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-include="static/partials/header.html"></div>

  <main id="main" class="err err--404">
    <div>
      <!-- 숫자 + 신호 표시를 한 그림으로 (오류 번호는 숫자가 일부러 흐리거나 잘려 있어 글자로도 표시) -->
      <figure class="err__fig">
        <div class="err__num" aria-hidden="true">4<span class="err__mid">0</span>4<svg class="err__line" viewBox="0 0 1000 40" preserveAspectRatio="none"><path d="M0 20 H430 l12 -12 l12 24 l12 -18 l12 6 H1000"/></svg></div>
        <figcaption class="err__meter">Error 404 · Input · <b>no signal</b></figcaption>
      </figure>
      <h1 class="err__title"><span class="sr-only">Error 404: </span>Lost the signal</h1>
      <p class="err__text">The page you're looking for doesn't exist or has moved.</p>
      <div class="err__actions"><a class="btn btn--primary" href="home.html">Back to home</a><button type="button" class="btn btn--ghost" data-action="back">Go back</button></div>
    </div>
    <!-- Nyxi error 포즈 (static/characters/nyxi/poses/error.png), 그림 왼쪽을 흐릿하게 처리 (일러스트삽입1) -->
    <div class="err__art" aria-hidden="true"><img src="static/characters/nyxi/poses/error.png" alt="" draggable="false"></div>
  </main>

  <div data-include="static/partials/footer.html"></div>
  <div data-include="static/partials/login-modal.html"></div>
  <script type="module" src="static/js/pages/error.js"></script>
</body>
</html>
